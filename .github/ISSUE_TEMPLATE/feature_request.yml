name: Feature request
description: Propose a scoped capability or improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior and boundaries.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Address permissions, credentials, network exposure, data handling, and write operations.
    validations:
      required: true
