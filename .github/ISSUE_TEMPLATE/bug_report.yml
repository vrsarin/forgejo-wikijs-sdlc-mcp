name: Bug report
description: Report a reproducible defect that is not a security vulnerability.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not use this form for security vulnerabilities. Use the private reporting link instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal, sanitized steps. Do not include credentials or tokens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, image digest, or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Forgejo MCP server
        - Wiki.js MCP server
        - Home Assistant MCP server
        - Direct client integration
        - CI or release pipeline
        - Documentation
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, private URLs, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
