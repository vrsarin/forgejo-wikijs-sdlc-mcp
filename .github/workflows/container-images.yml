name: Container images

on:
  pull_request:
    paths:
      - ".github/workflows/container-images.yml"
      - ".github/dependabot.yml"
      - ".dockerignore"
      - "VERSION"
      - "scripts/resolve-image-version.mjs"
      - "src/shared/**"
      - "src/forgejo-mcp-server/**"
      - "src/wikijs-sdlc-mcp-server/**"
      - "src/homeassistant-mcp-server/**"
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/container-images.yml"
      - ".dockerignore"
      - "VERSION"
      - "scripts/resolve-image-version.mjs"
      - "src/shared/**"
      - "src/forgejo-mcp-server/**"
      - "src/wikijs-sdlc-mcp-server/**"
      - "src/homeassistant-mcp-server/**"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  test:
    name: Test ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: forgejo-mcp-server
            package: src/forgejo-mcp-server
          - image: wikijs-sdlc-mcp-server
            package: src/wikijs-sdlc-mcp-server
          - image: homeassistant-mcp-server
            package: src/homeassistant-mcp-server
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
        working-directory: ${{ matrix.package }}
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.package }}
      - name: Type-check
        run: npm run check
        working-directory: ${{ matrix.package }}
      - name: Test
        run: npm test
        working-directory: ${{ matrix.package }}
      - name: Build
        run: npm run build
        working-directory: ${{ matrix.package }}

  scan:
    name: Scan ${{ matrix.image }} (${{ matrix.platform }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: forgejo-mcp-server
            dockerfile: src/forgejo-mcp-server/Dockerfile
            platform: linux/amd64
            arch: amd64
          - image: forgejo-mcp-server
            dockerfile: src/forgejo-mcp-server/Dockerfile
            platform: linux/arm64
            arch: arm64
          - image: wikijs-sdlc-mcp-server
            dockerfile: src/wikijs-sdlc-mcp-server/Dockerfile
            platform: linux/amd64
            arch: amd64
          - image: wikijs-sdlc-mcp-server
            dockerfile: src/wikijs-sdlc-mcp-server/Dockerfile
            platform: linux/arm64
            arch: arm64
          - image: homeassistant-mcp-server
            dockerfile: src/homeassistant-mcp-server/Dockerfile
            platform: linux/amd64
            arch: amd64
          - image: homeassistant-mcp-server
            dockerfile: src/homeassistant-mcp-server/Dockerfile
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image being scanned
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: local/${{ matrix.image }}:${{ matrix.arch }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Scan image filesystem and dependencies
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:${{ matrix.arch }}-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          scanners: vuln
      - name: Scan image for secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:${{ matrix.arch }}-${{ github.sha }}
          format: table
          exit-code: "1"
          scanners: secret
      - name: Create image SARIF report
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:${{ matrix.arch }}-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}-${{ matrix.arch }}.sarif
          exit-code: "0"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          scanners: vuln,secret
      - name: Upload image scan artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.image }}-${{ matrix.arch }}-${{ github.run_id }}
          path: trivy-${{ matrix.image }}-${{ matrix.arch }}.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Upload image results to code scanning
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          sarif_file: trivy-${{ matrix.image }}-${{ matrix.arch }}.sarif
          category: trivy-${{ matrix.image }}-${{ matrix.arch }}

  configuration-scan:
    name: Scan container configuration
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: src
          skip-files: "**/Dockerfile.dockerignore"
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: Create configuration SARIF report
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: src
          skip-files: "**/Dockerfile.dockerignore"
          format: sarif
          output: trivy-container-configuration.sarif
          exit-code: "0"
          severity: HIGH,CRITICAL
      - name: Upload configuration scan artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-container-configuration-${{ github.run_id }}
          path: trivy-container-configuration.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Upload configuration results to code scanning
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          sarif_file: trivy-container-configuration.sarif
          category: trivy-container-configuration

  publish:
    name: Publish ${{ matrix.image }}
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'release' && github.event.release.prerelease == false)
    needs: [test, scan, configuration-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: forgejo-mcp-server
            dockerfile: src/forgejo-mcp-server/Dockerfile
          - image: wikijs-sdlc-mcp-server
            dockerfile: src/wikijs-sdlc-mcp-server/Dockerfile
          - image: homeassistant-mcp-server
            dockerfile: src/homeassistant-mcp-server/Dockerfile
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve the semantic image version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/resolve-image-version.mjs
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Governed SDLC MCP server from ${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            io.github.sdlc-mcp.release-stage=${{ steps.version.outputs.stage }}
            io.github.sdlc-mcp.source-ref=${{ github.ref }}
            io.github.sdlc-mcp.source-head-ref=${{ github.head_ref || github.ref_name }}
            io.github.sdlc-mcp.source-head-revision=${{ github.event.pull_request.head.sha || github.sha }}
            io.github.sdlc-mcp.workflow-run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
