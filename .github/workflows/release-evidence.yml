name: Release evidence

on:
  release:
    types: [published]

concurrency:
  group: release-evidence-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-evidence:
    name: Build and verify release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
      CI_REPOSITORY: ${{ github.repository }}
      CI_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - name: Validate the release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_IS_PRERELEASE" != "false" ]]; then
            echo "Prereleases are not supported; use the automated dev, beta, or rc image stages." >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/forgejo-mcp-server/package-lock.json
            src/wikijs-sdlc-mcp-server/package-lock.json
            src/homeassistant-mcp-server/package-lock.json
      - name: Install locked dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm --prefix src/forgejo-mcp-server ci --ignore-scripts
          npm --prefix src/wikijs-sdlc-mcp-server ci --ignore-scripts
          npm --prefix src/homeassistant-mcp-server ci --ignore-scripts
      - name: Run release verification
        run: npm run precommit
      - name: Generate the changelog and verification report
        run: node scripts/generate-release-evidence.mjs
      - name: Package detailed evidence
        shell: bash
        run: |
          tar -czf .artifacts/release-assets/release-evidence.tar.gz \
            -C .artifacts/release-bundle .
          cd .artifacts/release-assets
          sha256sum \
            CHANGELOG.md \
            RELEASE-VERIFICATION.md \
            release-verification.json \
            forgejo-mcp-server.cdx.json \
            wikijs-sdlc-mcp-server.cdx.json \
            homeassistant-mcp-server.cdx.json \
            release-evidence.tar.gz > SHA256SUMS
      - name: Store release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: .artifacts/release-assets/
          if-no-files-found: error
          retention-days: 90

  attach-evidence:
    name: Attach evidence to the GitHub Release
    needs: build-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - name: Download verified evidence
        run: gh run download "$RUN_ID" --name release-evidence --dir release-assets
      - name: Verify evidence checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Attach evidence to the release
        shell: bash
        run: |
          assets=(
            release-assets/CHANGELOG.md
            release-assets/RELEASE-VERIFICATION.md
            release-assets/release-verification.json
            release-assets/forgejo-mcp-server.cdx.json
            release-assets/wikijs-sdlc-mcp-server.cdx.json
            release-assets/homeassistant-mcp-server.cdx.json
            release-assets/release-evidence.tar.gz
            release-assets/SHA256SUMS
          )
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
