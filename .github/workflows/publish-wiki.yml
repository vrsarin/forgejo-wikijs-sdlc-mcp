name: Publish GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-wiki.yml"
      - "scripts/sync-wiki.mjs"
      - "wiki/**"

concurrency:
  group: publish-github-wiki
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish repository wiki content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build GitHub Wiki pages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-wiki.mjs build "$RUNNER_TEMP/generated-wiki"
      - name: Push generated pages to the GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.WIKI_PUBLISH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the WIKI_PUBLISH_TOKEN Actions secret with write access to this repository's Wiki."
            exit 1
          fi

          gh auth setup-git --hostname github.com
          wiki_url="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote --exit-code "$wiki_url" HEAD >/dev/null 2>&1; then
            echo "::error::Initialize the GitHub Wiki by creating its first page in the Wiki tab, then rerun this workflow. Confirm WIKI_PUBLISH_TOKEN can access the Wiki."
            exit 1
          fi

          wiki_directory="$RUNNER_TEMP/wiki-repository"
          git clone "$wiki_url" "$wiki_directory"
          node scripts/sync-wiki.mjs apply "$RUNNER_TEMP/generated-wiki" "$wiki_directory"

          cd "$wiki_directory"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git add -f -- .sdlc-mcp-managed-pages
          while IFS= read -r page; do
            git add -f -- "$page"
          done < .sdlc-mcp-managed-pages
          if git diff --cached --quiet; then
            echo "GitHub Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs(wiki): sync from main (${GITHUB_SHA})"
          git push
