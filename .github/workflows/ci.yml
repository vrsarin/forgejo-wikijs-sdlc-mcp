name: CI

on:
  push:
    branches: [main, "release/**", "feature/**", "bug/**", "hotfix/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Lint and audit dependencies
        run: make lint audit
      - name: Type and syntax checks
        run: make check
      - name: Test and enforce coverage
        run: make coverage
      - name: Stage coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-${{ github.run_id }}
          path: .coverage/cobertura-coverage.xml
          if-no-files-found: error
          retention-days: 7
      - name: Validate Compose configurations
        run: make compose-check

  coverage:
    name: Upload coverage
    # Bootstrap GitHub Code Quality from the default branch. Pull requests still
    # enforce the local coverage threshold in the required test job above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cobertura-${{ github.run_id }}
      - name: Upload coverage to GitHub Code Quality
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1
        with:
          file: cobertura-coverage.xml
          language: JavaScript
          label: code-coverage/c8
          # Code Quality must be enabled in the repository settings first;
          # remove this once uploads succeed.
          fail-on-error: false
