name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/forgejo-mcp-server/package-lock.json
            src/wikijs-sdlc-mcp-server/package-lock.json
            src/homeassistant-mcp-server/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix src/forgejo-mcp-server ci --ignore-scripts
          npm --prefix src/wikijs-sdlc-mcp-server ci --ignore-scripts
          npm --prefix src/homeassistant-mcp-server ci --ignore-scripts
      - name: Lint and audit dependencies
        run: make lint audit
      - name: Type and syntax checks
        run: make check
      - name: Test
        run: make test
      - name: Validate Compose configurations
        run: make compose-check
