name: Repository security

on:
  push:
    branches: [main, "release/**", "feature/**", "bug/**", "hotfix/**"]
  pull_request:
    branches: [main, "release/**"]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

concurrency:
  group: repository-security-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  trivy:
    name: Dependencies, secrets, and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pinned-trivy
      - name: Enforce vulnerability and configuration gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          skip-files: "**/Dockerfile.dockerignore"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"
          skip-setup-trivy: true
      - name: Enforce secret detection gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          skip-setup-trivy: true
      - name: Create SARIF report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-files: "**/Dockerfile.dockerignore"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: sarif
          output: trivy-repository.sarif
          exit-code: "0"
          skip-setup-trivy: true
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-repository-${{ github.run_id }}
          path: trivy-repository.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Upload results to code scanning
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-repository.sarif
          category: trivy-repository
