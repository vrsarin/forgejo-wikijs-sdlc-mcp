name: Repository security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

concurrency:
  group: repository-security-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  trivy:
    name: Dependencies, secrets, and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pinned-trivy
      - name: Enforce vulnerability and configuration gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          skip-files: "**/Dockerfile.dockerignore"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"
          skip-setup-trivy: true
      - name: Enforce secret detection gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          skip-setup-trivy: true
      - name: Create SARIF report
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-files: "**/Dockerfile.dockerignore"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: sarif
          output: trivy-repository.sarif
          exit-code: "0"
          skip-setup-trivy: true
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-repository-${{ github.run_id }}
          path: trivy-repository.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Upload results to code scanning
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          sarif_file: trivy-repository.sarif
          category: trivy-repository
