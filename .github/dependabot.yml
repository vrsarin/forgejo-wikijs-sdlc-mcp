version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    # One grouped pull request per week avoids package-lock.json conflicts
    # between sibling Dependabot pull requests.
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Review @types/node majors manually; they must match the Node.js runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
